[project]
name = "checkstock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anor32", email = "burgerchiken@gmail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy[asyncio]>=2.0.39",
    "asyncpg>=0.29.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytest>=9.2.0",
    "httpx>=0.28.0",
    "ruff>=0.17.4",
]

[project.scripts]
checkstock = "src:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "PGH", # pygrep-hooks
    "PLR", # pylint refactor
    "TRY", # tryceratops
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "PERF",# flake8-perf
]
ignore = [
    "E501",
    "B008",
    "TRY003",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "RUF001",
    "RUF002",
]
fixable = ["ALL"]
unfixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src", "agents"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_any_generics = false
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services/containers (e.g. PostgreSQL via Testcontainers)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.10.0",
]
