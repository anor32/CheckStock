services:
  db:
    image: postgres:15
    container_name: checkstock-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkstock}
      POSTGRES_DB: ${POSTGRES_DB:-checkstock}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstock} -d ${POSTGRES_DB:-checkstock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: checkstock-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:-checkstock}@db:5432/${POSTGRES_DB:-checkstock}
    ports:
      - "8000:8000"
    entrypoint: ["python", "/app/bin/run_api"]

volumes:
  postgres_data:
